<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tune Tree</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500;600&family=Syne:wght@400;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>

<body>
  <!-- LOGIN -->
  <div id="login-page">
    <div class="login-box">
      <div class="login-logo">TUNE <span>TREE</span></div>
      <div class="login-sub">music library manager</div>
      <div class="login-label">Access Key</div>
      <input type="password" class="login-input" id="login-key" placeholder="输入访问密钥" autocomplete="current-password">
      <button class="login-btn" onclick="doLogin()">进入系统</button>
      <div class="login-error" id="login-error">密钥无效，请重试</div>
    </div>
  </div>

  <!-- APP -->
  <div id="app">
    <header class="header">
      <div class="header-logo">TUNE <span>TREE</span></div>
      <nav class="header-nav">
        <button class="nav-btn active" onclick="switchPage('artist')" id="nav-artist">艺术家视图</button>
        <button class="nav-btn" onclick="switchPage('files')" id="nav-files">目录浏览</button>
        <button class="nav-btn" onclick="switchPage('stats')" id="nav-stats">统计概览</button>
        <button class="nav-btn" onclick="switchPage('pending')" id="nav-pending">
          待定文件<span class="dot" id="pending-dot" style="display:none"></span>
        </button>
        <button class="nav-btn" onclick="switchPage('log')" id="nav-log">操作日志</button>
      </nav>
      <div class="header-actions">
        <span class="theme-indicator" id="theme-label" onclick="toggleTheme()" title="切换主题">DARK</span>
        <button class="icon-btn" id="scan-btn" onclick="doScan()" title="重新扫描">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button class="icon-btn" onclick="doLogout()" title="退出">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </header>

    <div class="body-layout">
      <aside class="sidebar">
        <div class="sidebar-search">
          <i class="bi bi-search sidebar-search-icon"></i>
          <input type="text" placeholder="搜索艺术家..." id="artist-search" oninput="filterArtists(this.value)">
        </div>
        <div class="sidebar-sort">
          <button class="sort-chip active" id="sort-artist-date" onclick="setArtistSort('date')">创建时间↓</button>
          <button class="sort-chip" id="sort-artist-count" onclick="setArtistSort('count')">歌曲数</button>
          <button class="sort-chip" id="sort-artist-name" onclick="setArtistSort('name')">名称</button>
          <button class="sort-chip" id="refresh-artist-btn" onclick="refreshArtistList()" title="刷新艺术家列表">
            <i class="bi bi-arrow-clockwise"></i>
          </button>
        </div>
        <div class="sidebar-filter-toggle">
          <button class="filter-toggle-btn" id="hide-organized-toggle" onclick="toggleHideOrganized()">
            <i class="bi bi-slash-circle"></i>
            <span>隐藏已整理</span>
          </button>
        </div>
        <div class="sidebar-selection-tools">
          <button class="toolbar-btn sidebar-selection-btn" id="artist-select-toggle"
            onclick="toggleArtistSelectionMode()">
            <i class="bi bi-check-lg"></i>
            <span id="artist-select-text">勾选艺术家</span>
          </button>
          <button class="toolbar-btn sidebar-selection-btn" id="range-select-btn" onclick="toggleRangeSelectMode()"
            style="display:none;">
            <i class="bi bi-grid-3x3"></i>
            <span id="range-select-text">选择范围</span>
          </button>
        </div>
        <div id="scan-status" class="scan-status" style="display:none;">
          <i class="bi bi-arrow-clockwise spin"></i>
          <span id="scan-status-text">正在扫描中...</span>
        </div>
        <div class="sidebar-tree" id="artist-tree">
          <div class="loading-row">加载中...</div>
        </div>
      </aside>

      <div class="main">
        <!-- ARTIST PAGE -->
        <div class="page active" id="page-artist">
          <div class="main-toolbar">
            <span class="toolbar-path" id="breadcrumb"><span>全部艺术家</span></span>
            <button class="toolbar-btn" id="select-all-btn" onclick="selectAllAlbums()">全选专辑</button>
            <button class="toolbar-btn primary" id="format-btn" onclick="openFormatModal()"
              style="display:none;">格式化目录</button>
            <button class="toolbar-btn" id="download-artist-btn" onclick="downloadCurrentArtist()"
              style="display:none;">下载全部</button>
            <button class="toolbar-btn" id="download-selected-btn" onclick="downloadSelectedTracks()"
              style="display:none;">下载选中</button>
            <span class="select-count" id="select-count" style="display:none;"></span>
          </div>
          <div class="artist-view" id="artist-view">
            <div class="empty-state">
              <div class="empty-icon">
                <i class="bi bi-music-note" style="font-size: 32px;"></i>
              </div>
              <div class="empty-text">请从左侧选择艺术家</div>
            </div>
          </div>
        </div>

        <!-- FILES PAGE -->
        <div class="page" id="page-files">
          <div class="main-toolbar">
            <span class="toolbar-path" id="file-path-display"><span id="file-path-text">/</span></span>
            <button class="toolbar-btn" onclick="filesGoUp()">
              <i class="bi bi-chevron-left"></i>
              上级目录
            </button>
            <div class="files-search" style="display:flex;align-items:center;gap:8px;margin-left:4px;">
              <i class="bi bi-search files-search-icon"></i>
              <input type="text" placeholder="搜索文件..." id="file-search" oninput="filterFiles(this.value)">
            </div>
            <div style="display:flex;gap:4px;margin-left:4px;">
              <button class="sort-chip active" id="sort-name" onclick="setFileSort('name')">名称</button>
              <button class="sort-chip" id="sort-date" onclick="setFileSort('date')">时间</button>
            </div>
            <div style="display:flex;gap:4px;margin-left:8px;">
              <button class="sort-chip active" id="folders-first" onclick="toggleFoldersFirst()">文件夹优先</button>
            </div>
          </div>
          <div class="files-view" id="files-view">
            <div class="file-header-row">
              <div class="fh"></div>
              <div class="fh">文件名</div>
              <div class="fh">路径</div>
              <div class="fh" style="text-align:center;">类型</div>
              <div class="fh" style="text-align:right;">大小</div>
              <div class="fh" style="text-align:right;">修改时间</div>
              <div class="fh"></div>
            </div>
            <div id="file-list">
              <div class="loading-row">加载中...</div>
            </div>
            <div class="pagination-bar" id="pagination-bar">
              <button class="toolbar-btn" id="btn-prev" onclick="goToPage(currentOffset - PAGE_SIZE)"
                disabled>上一页</button>
              <span id="pagination-info" style="margin:0 12px;">—</span>
              <button class="toolbar-btn" id="btn-next" onclick="goToPage(currentOffset + PAGE_SIZE)"
                disabled>下一页</button>
            </div>
          </div>
        </div>

        <!-- STATS PAGE -->
        <div class="page" id="page-stats">
          <div class="stats-view" id="stats-view">
            <div class="loading-row">加载中...</div>
          </div>
        </div>

        <!-- PENDING PAGE -->
        <div class="page" id="page-pending">
          <div class="pending-view" id="pending-view">
            <div class="loading-row">加载中...</div>
          </div>
        </div>

        <!-- LOG PAGE -->
        <div class="page" id="page-log">
          <div class="main-toolbar">
            <span class="toolbar-path"><span>操作日志</span></span>
            <button class="toolbar-btn danger" onclick="clearLog()">清空日志</button>
          </div>
          <div class="log-view" id="log-view"></div>
        </div>
      </div>

      <!-- DETAIL PANEL -->
      <aside class="detail-panel hidden" id="detail-panel">
        <div class="detail-header">
          <button class="detail-collapse-btn" onclick="toggleDetailPanel()" title="收起侧边栏">
          </button>
        </div>
        <div class="detail-cover-wrapper">
          <div class="detail-cover" id="detail-cover">
            <i class="bi bi-disc" style="font-size: 48px;"></i>
          </div>
        </div>
        <div class="detail-body" id="detail-body"></div>
      </aside>
    </div>
  </div>

  <!-- FORMAT MODAL -->
  <div class="modal-overlay" id="format-modal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">格式化预览</div>
        <button class="modal-close" onclick="closeModal('format-modal')">✕</button>
      </div>
      <div class="modal-body" id="format-modal-body"></div>
      <div class="modal-footer">
        <div class="modal-info" id="format-modal-info"></div>
        <button class="toolbar-btn" onclick="closeModal('format-modal')">取消</button>
        <button class="toolbar-btn primary" id="format-exec-btn" onclick="executeFormat()">确认执行</button>
      </div>
    </div>
  </div>

  <!-- CONFIRM MODAL -->
  <div class="modal-overlay" id="confirm-modal">
    <div class="modal confirm-modal">
      <div class="modal-header">
        <div class="modal-title" id="confirm-title">确认操作</div>
        <button class="modal-close" onclick="closeModal('confirm-modal')">✕</button>
      </div>
      <div class="modal-body">
        <div class="confirm-msg" id="confirm-msg"></div>
      </div>
      <div class="modal-footer">
        <button class="toolbar-btn" onclick="closeModal('confirm-modal')">取消</button>
        <button class="toolbar-btn primary" id="confirm-ok-btn">确认</button>
      </div>
    </div>
  </div>

  <!-- DUPLICATE DETAILS MODAL -->
  <div class="modal-overlay" id="duplicate-modal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">重复文件详情</div>
        <button class="modal-close" onclick="closeModal('duplicate-modal'); hideDetailPanel()">✕</button>
      </div>
      <div class="modal-body" id="duplicate-modal-body"></div>
      <div class="modal-footer" id="duplicate-modal-footer">
        <button class="toolbar-btn" onclick="closeModal('duplicate-modal'); hideDetailPanel()">关闭</button>
      </div>
    </div>
  </div>

  <!-- DELETE PREVIEW MODAL -->
  <div class="modal-overlay" id="delete-preview-modal">
    <div class="modal" style="width:800px;">
      <div class="modal-header">
        <div class="modal-title">删除预览</div>
        <button class="modal-close" onclick="closeModal('delete-preview-modal')">✕</button>
      </div>
      <div class="modal-body" id="delete-preview-body"></div>
      <div class="modal-footer">
        <span id="delete-preview-info" style="flex:1;text-align:left;font-size:12px;color:var(--text3);"></span>
        <button class="toolbar-btn" onclick="closeModal('delete-preview-modal')">取消</button>
        <button class="toolbar-btn danger" id="delete-exec-btn" onclick="executeDeleteDuplicates()">确认删除</button>
      </div>
    </div>
  </div>

  <!-- METADATA EDIT MODAL -->
  <div class="modal-overlay" id="metadata-edit-modal">
    <div class="modal edit-modal">
      <div class="modal-header">
        <div class="modal-title">编辑元数据</div>
        <button class="modal-close" onclick="closeMetadataEdit()">✕</button>
      </div>
      <div class="modal-body"></div>
      <div class="modal-footer">
        <button class="toolbar-btn" onclick="closeMetadataEdit()">取消</button>
        <button class="toolbar-btn primary" id="metadata-edit-save-btn" onclick="saveMetadataEdit()">保存</button>
      </div>
    </div>
  </div>

  <!-- SCRAPE RESULTS MODAL -->
  <div class="modal-overlay" id="scrape-results-modal">
    <div class="modal scrape-results-modal">
      <div class="modal-header">
        <div class="modal-title">搜索结果</div>
        <button class="modal-close" onclick="closeScrapeResultsModal()">✕</button>
      </div>
      <div class="modal-body" id="scrape-results-body">
        <div class="scrape-loading">
          <div class="loading-spinner"></div>
          <div>正在获取音乐标签...</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="toolbar-btn" onclick="closeScrapeResultsModal()">取消</button>
      </div>
    </div>
  </div>

  <!-- LYRICS EDITOR MODAL -->
  <div class="modal-overlay" id="lyrics-editor-modal">
    <div class="modal lyrics-editor-modal">
      <div class="modal-header">
        <div class="modal-title">编辑歌词</div>
        <button class="modal-close" onclick="closeLyricsEditorModal()">✕</button>
      </div>
      <div class="modal-body lyrics-editor-body">
        <div class="lyrics-editor-info" id="lyrics-editor-info"></div>
        <div class="lyrics-player-bar">
          <audio id="lyrics-audio"></audio>
          <div class="lyrics-player-main">
            <div class="lyrics-player-controls">
              <button class="lyrics-player-btn" onclick="seekBackward()" title="快退5s (Ctrl+←)">
                <i class="bi bi-skip-backward-fill"></i>
              </button>
              <button class="lyrics-player-btn lyrics-play-btn" id="lyrics-play-btn" onclick="togglePlay()"
                title="播放/暂停 (Ctrl+Space)">
                <i class="bi bi-play-fill"></i>
              </button>
              <button class="lyrics-player-btn" onclick="seekForward()" title="快进5s (Ctrl+→)">
                <i class="bi bi-skip-forward-fill"></i>
              </button>
              <button class="lyrics-player-btn lyrics-stamp-btn" onclick="stampTimestamp()" title="打轴 (Ctrl+Enter)">
                <i class="bi bi-clock"></i>
              </button>
            </div>
            <div class="lyrics-player-progress">
              <span class="lyrics-time" id="lyrics-time-current">00:00.000</span>
              <div class="lyrics-progress-bar" id="lyrics-progress-bar" onclick="seekToPosition(event)">
                <div class="lyrics-progress-fill" id="lyrics-progress-fill"></div>
              </div>
              <span class="lyrics-time" id="lyrics-time-total">00:00.000</span>
            </div>
            <div class="lyrics-player-volume">
              <i class="bi bi-volume-up"></i>
              <input type="range" id="lyrics-volume-slider" min="0" max="1" step="0.05" value="0.8"
                oninput="setVolume(this.value)">
            </div>
            <span class="lyrics-audio-filename" id="lyrics-audio-filename"></span>
          </div>
        </div>
        <div class="lyrics-editor-toolbar">
          <button class="toolbar-btn" onclick="showLyricsSearchInEditor()">
            <i class="bi bi-search"></i>
            搜索歌词
          </button>
          <button class="toolbar-btn" onclick="resetLyricsEdit()">
            <i class="bi bi-arrow-counterclockwise"></i>
            重置
          </button>
          <button class="toolbar-btn" onclick="copyLyricsToClipboard()">
            <i class="bi bi-clipboard"></i>
            复制
          </button>
          <button class="toolbar-btn" onclick="exportLrcFile()">
            <i class="bi bi-download"></i>
            导出LRC
          </button>
          <div class="lyrics-shortcuts-hint">
            <span>Ctrl+Enter 打轴</span>
            <span>Ctrl+Space 播放/暂停</span>
            <span>Ctrl+←/→ 快退/快进5s</span>
            <span>↑/↓ 切换行</span>
          </div>
        </div>
        <div class="lyrics-editor-search-panel" id="lyrics-editor-search-panel" style="display:none;">
          <div class="lyrics-search-results" id="lyrics-editor-search-results"></div>
        </div>
        <div class="lyrics-editor-metadata" id="lyrics-editor-metadata" style="display:none;"></div>
        <div class="lyrics-editor-content">
          <div class="lyrics-editor-lines" id="lyrics-editor-lines"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="toolbar-btn" onclick="closeLyricsEditorModal()">取消</button>
        <button class="toolbar-btn primary" id="lyrics-editor-confirm-btn" onclick="confirmLyricsEdit()">确认</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <!-- JavaScript Modules (load order matters) -->
  <script defer src="{{ url_for('static', filename='js/modules/utils.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/modules/api.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/modules/state.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/modules/ui.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/modules/auth.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/modules/image-viewer.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/modules/artist.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/modules/files.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/modules/stats.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/modules/pending.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/modules/logs.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/modules/format.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/modules/detail.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/modules/lrc-parser.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/modules/lyrics-editor.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/modules/metadata-edit.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>

</html>
