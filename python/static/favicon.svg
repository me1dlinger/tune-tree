<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Rounded rect background -->
  <rect width="32" height="32" rx="7" fill="#f4f4f0"/>

  <!-- Tree trunk -->
  <rect x="14.5" y="19" width="3" height="8" rx="1.5" fill="#64748b"/>

  <!-- Branches -->
  <line x1="16" y1="22" x2="8" y2="17" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="22" x2="24" y2="17" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

  <!-- Tree crown - sub left -->
  <circle cx="8.5" cy="16" r="5" fill="#16a34a"/>
  <!-- Tree crown - sub right -->
  <circle cx="23.5" cy="16" r="5" fill="#16a34a"/>
  <!-- Tree crown - main center (drawn last, on top) -->
  <circle cx="16" cy="12" r="7" fill="#22c55e"/>
  <!-- Crown highlight -->
  <circle cx="13.5" cy="9.5" r="2.5" fill="#4ade80" opacity="0.35"/>

  <!-- Double eighth note (top-right) -->
  <!-- Note head 1 -->
  <ellipse cx="24" cy="7.5" rx="2.2" ry="1.7" fill="#3b82f6" transform="rotate(-20 24 7.5)"/>
  <!-- Stem 1 -->
  <line x1="25.8" y1="6.8" x2="25.8" y2="1.8" stroke="#3b82f6" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Note head 2 -->
  <ellipse cx="28.5" cy="5.8" rx="2.2" ry="1.7" fill="#3b82f6" transform="rotate(-20 28.5 5.8)"/>
  <!-- Stem 2 -->
  <line x1="30.3" y1="5.1" x2="30.3" y2="0.1" stroke="#3b82f6" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Beam 1 -->
  <line x1="25.8" y1="1.8" x2="30.3" y2="0.1" stroke="#3b82f6" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Beam 2 -->
  <line x1="25.8" y1="3.4" x2="30.3" y2="1.7" stroke="#3b82f6" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

  <!-- Directory lines at bottom -->
  <line x1="7" y1="28.5" x2="25" y2="28.5" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="7" y1="31" x2="17" y2="31" stroke="#475569" stroke-width="1.3" stroke-linecap="round" opacity="0.65"/>
</svg>